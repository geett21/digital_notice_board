
<!DOCTYPE html>
<html>
<head>
    <title>Add Notice</title>
    <style>
        body {
            background: #f4f7fb;
            font-family: Arial;
            padding: 30px;
        }
        .form-box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            box-sizing: border-box;
        }
        button {
            background: #173b70;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Add / Edit Notice</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Notice</button>
    </form>

    <p><a href="{% url 'admin_dashboard' %}">Back to Dashboard</a></p>
</div>

</body>
</html>
