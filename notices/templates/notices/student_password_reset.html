
{% extends 'notices/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h2 class="text-center mb-4">
                    Reset Student Password
                </h2>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mb-3">
                        <label for="new_password">
                            New Password
                        </label>
                        <input
                            type="password"
                            name="new_password"
                            id="new_password"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password">
                            Confirm New Password
                        </label>
                        <input
                            type="password"
                            name="confirm_password"
                            id="confirm_password"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Reset Password
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'student_login' %}">
                        Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
