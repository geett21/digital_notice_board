{% extends 'notices/base.html' %}

{% block title %}Password updated | Campus Notice Board{% endblock %}

{% block content %}
<section class="login-section">
    <div class="login-card text-center">
        <div class="login-icon mx-auto"><i class="bi bi-check2-circle"></i></div>
        <span class="eyebrow text-primary">PASSWORD RECOVERY</span>
        <h1>Password updated</h1>
        <p class="text-secondary my-4">Your password has been changed. You can now sign in with your new password.</p>
        <a class="btn btn-primary" href="{% url 'student_login' %}">Sign in</a>
    </div>
</section>
{% endblock %}
