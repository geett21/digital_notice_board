{% extends 'notices/base.html' %}

{% block title %}Check your email | Campus Notice Board{% endblock %}

{% block content %}
<section class="login-section">
    <div class="login-card text-center">
        <div class="login-icon mx-auto"><i class="bi bi-envelope-check"></i></div>
        <span class="eyebrow text-primary">PASSWORD RECOVERY</span>
        <h1>Check your email</h1>
        <p class="text-secondary my-4">If an active student account uses that email address, password reset instructions are on their way.</p>
        <a class="btn btn-primary" href="{% url 'student_login' %}">Return to login</a>
    </div>
</section>
{% endblock %}
